services:
  game:
    build: .
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      SERVER_ADDR: 0.0.0.0:8080
      STATIC_DIR: /app/dist
    networks:
      - onmars

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - game
    networks:
      - onmars

networks:
  onmars:

volumes:
  caddy_data:
  caddy_config:
